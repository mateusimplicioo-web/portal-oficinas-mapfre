<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal de Oficinas MAPFRE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background-image:url("static/img/Fondo_Teams_Mapfre30 1 2.jpg");

    background-repeat:no-repeat;

    background-position:center center;

    background-size:contain;

    background-color:#efefef;
}

.login-box{

    width:480px;

    background:rgba(255,255,255,0.92);

    backdrop-filter:blur(8px);

    border-radius:20px;

    padding:40px;

    box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

.logo{

    text-align:center;

    margin-bottom:20px;
}

.logo img{

    width:180px;
}

h1{

    text-align:center;

    color:#d81e05;

    margin-bottom:10px;
}

.subtitulo{

    text-align:center;

    color:#666;

    margin-bottom:30px;
}

label{

    display:block;

    margin-bottom:5px;

    font-weight:600;
}

input{

    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:10px;

    margin-bottom:20px;
}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#d81e05;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

button:hover{

    background:#b30000;
}

.links{

    text-align:center;

    margin-top:20px;
}

.links a{

    display:block;

    color:#d81e05;

    text-decoration:none;

    margin-top:10px;
}

.links a:hover{

    text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">

        <tatic/img/FUNDO BRANCO 1.png

    </div>

    <h1>Portal de Oficinas MAPFRE</h1>

    <div class="subtitulo">

        Gestão de Reparos Automotivos

    </div>

    <label>E-mail</label>

    <input
        type="email"
        placeholder="Digite seu e-mail">

    <label>Senha</label>

    <input
        type="password"
        placeholder="Digite sua senha">

    <button onclick="window.location.href='dashboard.html'">
    Entrar
</button>


    <div class="links">

        <a href="#">
   Criar Conta
        </a>

        <a href       Esqueci Minha Senha
        </a>

    </div>

</div>

</body>

</html>
